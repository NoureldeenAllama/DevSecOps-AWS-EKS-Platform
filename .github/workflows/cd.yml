name: CD

on:
  workflow_run:
    workflows:
      - "Java CI"
    types:
      - completed

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          
     
#install kubectl to interact with the EKS cluster      
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
#confugure kubectl to use the EKS cluster
      - name: Update kubeconfig 
        run: |
          aws eks update-kubeconfig \
            --region ${{ secrets.AWS_REGION }} \
            --name ${{ secrets.EKS_CLUSTER_NAME }}
#check connectivity to the EKS cluster
      - name: Check kubectl connectivity
        run: |
          kubectl get nodes

      - name: Install Helm
        uses: azure/setup-helm@v4
      
      - name: Deploy to EKS
        run: |
          helm upgrade --install vprofile ./helm \
            --namespace vprofile \
            --create-namespace \
            --set frontend.image.tag=${{ github.event.workflow_run.head_sha }} \
            --set backend.image.tag=${{ github.event.workflow_run.head_sha }} \
            --set db.image.tag=${{ github.event.workflow_run.head_sha }}
      - name: Verify Deployments
        run: |
          kubectl get deployments -n vprofile

      - name: Verify Pods
        run: |
          kubectl get pods -n vprofile
          

      - name: Verify Services
        run: |
          kubectl get svc -n vprofile


      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/frontend -n vprofile --timeout=300s
          kubectl rollout status deployment/backend -n vprofile --timeout=300s
          kubectl rollout status deployment/db -n vprofile --timeout=300s
      