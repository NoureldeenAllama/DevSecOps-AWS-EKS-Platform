apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: custom-alert-rules
  namespace: monitoring
  labels:
    release: monitoring

spec:
  groups:
    - name: kubernetes-alerts
      rules:

        - alert: PodDown
          expr: kube_pod_status_phase{phase="Running"} == 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Pod is not running"
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is not running."

        - alert: NodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Node is Not Ready"
            description: "Node {{ $labels.node }} is not Ready."

        - alert: HighCPUUsage
          expr: (100 - (avg by(instance)(irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High CPU Usage"
            description: "CPU usage on {{ $labels.instance }} is above 80%."

        - alert: HighMemoryUsage
          expr: ((node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes) * 100 > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High Memory Usage"
            description: "Memory usage on {{ $labels.instance }} is above 80%."
