alertmanager:
  config:
    global:
      smtp_smarthost: 'smtp.gmail.com:587'
      smtp_from: 'mahmoudnaawwwar@gmail.com'
      smtp_auth_username: 'mahmoudnaawwwar@gmail.com'
      smtp_auth_password: 'tyfycoizdoabzkhf'
      smtp_require_tls: true

    route:
      group_by: ['namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: email-alerts
      routes:
        - matchers:
            - alertname = "Watchdog"
          receiver: "null"

    receivers:
      - name: "null"

      - name: email-alerts
        email_configs:
          - to: 'mahmoudnaawwwar@gmail.com'
            send_resolved: true

    inhibit_rules:
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity =~ warning|info
        equal:
          - namespace
          - alertname

      - source_matchers:
          - severity = warning
        target_matchers:
          - severity = info
        equal:
          - namespace
          - alertname

      - source_matchers:
          - alertname = InfoInhibitor
        target_matchers:
          - severity = info
        equal:
          - namespace

      - target_matchers:
          - alertname = InfoInhibitor

    templates:
      - /etc/alertmanager/config/*.tmpl